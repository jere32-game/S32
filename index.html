<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch32 - Sube y Juega</title>
    <style>
        :root {
            --bg: #0f0f13;
            --panel: #1a1a24;
            --primary: #00ff6b; 
            --primary-hover: #33ff88;
            --danger: #ff4444;
            --danger-hover: #ff6666;
            --text: #ffffff;
            --text-muted: #8e8e9f;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--panel);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 15px rgba(0, 255, 107, 0.1);
        }

        header h1 {
            font-size: 1.5rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header h1 span {
            color: var(--primary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .warp-badge {
            background-color: #333;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #fff;
        }

        .ss-icon {
            background-color: #2a2a35;
            color: var(--text-muted);
            padding: 5px 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            border: 1px solid #444;
            transition: all 0.2s;
        }

        .ss-icon:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .publish-section {
            background-color: var(--panel);
            padding: 2rem;
            border-radius: var(--radius);
            margin-bottom: 2rem;
        }

        .publish-section h2 {
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .form-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .input-box {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-box label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input[type="text"] {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--bg);
            border: 1px solid #333;
            color: var(--text);
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="file"] {
            width: 100%;
            padding: 0.7rem;
            background-color: var(--bg);
            border: 1px dashed #333;
            color: var(--text);
            border-radius: 6px;
            cursor: pointer;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            padding: 0.8rem 1.5rem;
            background-color: var(--primary);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            white-space: nowrap;
        }

        button:hover:not(:disabled) {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
            color: #888;
        }

        button.btn-danger {
            background-color: var(--danger);
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        button.btn-danger:hover:not(:disabled) {
            background-color: var(--danger-hover);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .project-card {
            background-color: var(--panel);
            border-radius: var(--radius);
            padding: 1.5rem;
            border: 1px solid #333;
            transition: border-color 0.3s;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .project-card:hover {
            border-color: var(--primary);
        }

        .project-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 1rem;
            background-color: #000;
            border: 1px solid #333;
        }

        .project-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .project-author {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .play-btn {
            margin-top: auto;
            width: 100%;
            text-align: center;
        }

        #loading-msg {
            color: var(--primary);
            margin-top: 1rem;
            padding: 10px;
            background: rgba(0, 255, 107, 0.1);
            border-radius: 8px;
            font-family: monospace;
        }

        #game-view {
            display: none;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        #game-iframe {
            width: 100%;
            height: 75vh;
            border: 2px solid var(--primary);
            border-radius: var(--radius);
            background-color: #000;
            box-shadow: 0 4px 20px rgba(0, 255, 107, 0.1);
        }

        /* --- NUEVO: ESTILOS DE COMENTARIOS --- */
        .comments-section {
            background-color: var(--panel);
            border-radius: var(--radius);
            padding: 2rem;
            margin-top: 1rem;
            border: 1px solid #333;
        }

        .comments-section h3 {
            color: var(--primary);
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #333;
            padding-bottom: 0.5rem;
        }

        .comment-form {
            background-color: var(--bg);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #222;
        }

        .comment-list {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .comment-item {
            display: flex;
            gap: 1rem;
            background-color: var(--bg);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .comment-pfp {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            flex-shrink: 0;
            background-color: #000;
        }

        .comment-content {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .comment-name {
            font-weight: bold;
            color: var(--text);
        }

        .comment-date {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .comment-text {
            color: #ddd;
            line-height: 1.4;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Scratch<span>32</span></h1>
            <p>Galería de mods y extensiones custom.</p>
        </div>
        <div class="header-actions">
            <div class="warp-badge">⚡ Powered by Warp & YYF</div>
            <div class="ss-icon" onclick="toggleAdmin()" title="Admin Login">SS</div>
        </div>
    </header>

    <main>
        <div id="main-content">
            <div class="publish-section">
                <h2>Publicar un Proyecto</h2>
                <p style="color: var(--text-muted); margin-bottom: 1rem;">Selecciona tu archivo (.pmp o .sb3) y una imagen de portada. Se subirá automáticamente.</p>
                <div class="form-group">
                    <div class="input-box">
                        <label>Nombre del Juego</label>
                        <input type="text" id="proj-name" placeholder="Ej: Mi Super Mod" autocomplete="off">
                    </div>
                    <div class="input-box">
                        <label>Autor/Nick</label>
                        <input type="text" id="proj-author" placeholder="Ej: Jere32" autocomplete="off">
                    </div>
                    <div class="input-box">
                        <label>Archivo del Proyecto (.sb3, .pmp)</label>
                        <input type="file" id="proj-file" accept=".sb3,.pmp">
                    </div>
                    <div class="input-box">
                        <label>Imagen de Portada (Opcional)</label>
                        <input type="file" id="proj-image" accept="image/*">
                    </div>
                </div>
                <button id="publish-btn" onclick="publishProject()" style="width: 100%; margin-top: 10px;">Subir y Publicar</button>
                <p id="publish-status" style="font-size: 0.9rem; margin-top: 10px;"></p>
            </div>

            <h2 style="margin-bottom: 1.5rem; border-bottom: 1px solid #333; padding-bottom: 0.5rem;">Galería Global</h2>
            <div id="loading-msg">Iniciando conexión con ikelene.dev...</div>
            <div class="gallery" id="gallery-container">
                </div>
        </div>

        <div id="game-view">
            <button onclick="closeGame()" style="align-self: flex-start; margin-bottom: 5px;">⬅️ Volver a la Galería</button>
            <iframe id="game-iframe" src=""></iframe>
            
            <div class="comments-section">
                <h3>Comentarios del Proyecto</h3>
                <div class="comment-form form-group">
                    <div class="input-box" style="flex: 1; min-width: 150px;">
                        <label>Tu Nombre</label>
                        <input type="text" id="cmt-name" placeholder="Ej: Jere32" autocomplete="off">
                    </div>
                    <div class="input-box" style="flex: 1; min-width: 150px;">
                        <label>Foto de Perfil (Opcional)</label>
                        <input type="file" id="cmt-pfp" accept="image/*">
                    </div>
                    <div class="input-box" style="flex: 3; min-width: 250px;">
                        <label>Comentario</label>
                        <input type="text" id="cmt-text" placeholder="¡Qué buen mod!..." autocomplete="off">
                    </div>
                    <button id="cmt-btn" onclick="postComment()" style="align-self: flex-end; margin-bottom: 2px;">Enviar</button>
                </div>
                <p id="cmt-status" style="color: var(--primary); font-size: 0.9rem; margin-top: 5px;"></p>
                
                <div id="comments-list" class="comment-list">
                    </div>
            </div>
        </div>
    </main>

    <script>
        const SERVER_URL = 'https://ikelene.dev/storage/';
        const API_KEY = '723cb2775320f1d255393b2d93d2f9262331d7e7'; 
        const YYF_URL = 'https://yyf.mubilop.com';
        const PREFIX = 'warphub_proj_';
        const CMT_PREFIX = 'warphub_cmts_'; // NUEVO: Prefijo para comentarios
        
        let isAdmin = false; 
        let currentProjectKey = ''; // NUEVO: Para saber en qué proyecto estamos comentando

        document.addEventListener('DOMContentLoaded', loadProjects);

        function toggleAdmin() {
            if (isAdmin) {
                isAdmin = false;
                alert("Modo admin desactivado.");
                loadProjects();
                return;
            }
            const pwd = prompt("Ingresa el comando secreto:");
            if (pwd === "/sus32") {
                isAdmin = true;
                alert("Modo admin activado. Ahora puedes eliminar proyectos.");
                loadProjects(); 
            } else if (pwd !== null) {
                alert("Comando incorrecto.");
            }
        }

        async function uploadFileToYYF(file) {
            const formData = new FormData();
            formData.append('file', file, file.name);

            const yyfResponse = await fetch(`${YYF_URL}/api/upload`, {
                method: 'POST',
                body: formData
            });

            if (!yyfResponse.ok) throw new Error(`Error de YYF: ${yyfResponse.status}`);
            const yyfData = await yyfResponse.json();
            return YYF_URL + yyfData.fileUrl;
        }

        async function publishProject() {
            const name = document.getElementById('proj-name').value.trim();
            const author = document.getElementById('proj-author').value.trim();
            const fileInput = document.getElementById('proj-file');
            const imageInput = document.getElementById('proj-image');
            const statusText = document.getElementById('publish-status');
            const btn = document.getElementById('publish-btn');

            if(!name || !author || fileInput.files.length === 0) {
                statusText.style.color = '#ff4444';
                statusText.textContent = 'Falta el nombre, autor o el archivo del proyecto.';
                return;
            }

            const projectFile = fileInput.files[0];
            const imageFile = imageInput.files.length > 0 ? imageInput.files[0] : null;
            
            btn.disabled = true;
            statusText.style.color = 'var(--text)';
            
            try {
                statusText.textContent = 'Paso 1/3: Subiendo proyecto a YeetYourFiles...';
                const projectUrl = await uploadFileToYYF(projectFile);

                let imageUrl = 'https://via.placeholder.com/400x200/1a1a24/00ff6b?text=Sin+Portada';
                if (imageFile) {
                    statusText.textContent = 'Paso 2/3: Subiendo imagen de portada...';
                    imageUrl = await uploadFileToYYF(imageFile);
                }

                statusText.textContent = 'Paso 3/3: Guardando en la galería global...';
                const projectData = {
                    name: name,
                    author: author,
                    url: projectUrl, 
                    imageUrl: imageUrl,
                    timestamp: Date.now()
                };

                const uniqueKey = PREFIX + Date.now();

                const dbResponse = await fetch(SERVER_URL + 'store.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({
                        apiKey: API_KEY,
                        key: uniqueKey,
                        value: JSON.stringify(projectData),
                        mimeType: 'application/json'
                    })
                });

                if(dbResponse.ok) {
                    statusText.style.color = '#00ff88';
                    statusText.textContent = '¡Proyecto subido y publicado con éxito!';
                    document.getElementById('proj-name').value = '';
                    document.getElementById('proj-author').value = '';
                    document.getElementById('proj-file').value = '';
                    document.getElementById('proj-image').value = '';
                    loadProjects(); 
                } else {
                    throw new Error('El servidor rechazó el guardado. Verifica tu API Key.');
                }
            } catch (error) {
                statusText.style.color = '#ff4444';
                statusText.textContent = 'Error: ' + error.message;
            } finally {
                btn.disabled = false;
            }
        }

        async function loadProjects() {
            const gallery = document.getElementById('gallery-container');
            const loading = document.getElementById('loading-msg');
            
            loading.style.display = 'block';
            loading.style.color = 'var(--primary)';
            gallery.innerHTML = '';

            try {
                loading.textContent = "> Paso 1: Pidiendo lista de proyectos a ikelene.dev...";
                
                const resList = await fetch(SERVER_URL + 'listKeys.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ apiKey: API_KEY })
                });
                
                const listData = await resList.json();
                
                if(!listData.success) {
                    throw new Error(`El servidor rechazó la petición: ${JSON.stringify(listData)}`);
                }

                const projectKeys = listData.keys.filter(k => k.startsWith(PREFIX));

                if(projectKeys.length === 0) {
                    loading.textContent = "Aún no hay proyectos publicados. ¡Sé el primero!";
                    return;
                }

                projectKeys.reverse();
                loading.textContent = `> Paso 2: Descargando ${projectKeys.length} proyectos uno por uno...`;
                
                let loadedCount = 0;

                for (const key of projectKeys) {
                    try {
                        const resGet = await fetch(SERVER_URL + 'get.php', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                            body: JSON.stringify({ apiKey: API_KEY, key: key })
                        });
                        
                        const getData = await resGet.json();
                        
                        if (getData.success && getData.data && getData.data.value) {
                            const pData = JSON.parse(getData.data.value);
                            createProjectCard(pData, key);
                            loadedCount++;
                        }
                    } catch (err) {
                        console.warn("Saltando proyecto dañado:", key, err);
                    }
                }

                if (loadedCount > 0) {
                    loading.style.display = 'none';
                } else {
                    loading.style.color = '#ff4444';
                    loading.textContent = "Error: Se encontraron proyectos, pero la información dentro de ellos estaba corrupta.";
                }

            } catch (error) {
                loading.style.color = '#ff4444';
                loading.innerHTML = `❌ Error fatal al cargar:<br>${error.message}`;
                console.error(error);
            }
        }

        function createProjectCard(data, key) {
            const gallery = document.getElementById('gallery-container');
            const card = document.createElement('div');
            card.className = 'project-card';
            
            const imgSource = data.imageUrl ? escapeHTML(data.imageUrl) : 'https://via.placeholder.com/400x200/1a1a24/00ff6b?text=Sin+Portada';
            
            let htmlStr = `
                <img class="project-image" src="${imgSource}" alt="Portada" loading="lazy">
                <div class="project-title">${escapeHTML(data.name || 'Sin Título')}</div>
                <div class="project-author">Por: ${escapeHTML(data.author || 'Desconocido')}</div>
                <button class="play-btn" onclick="playProject('${escapeHTML(data.url || '')}', '${key}')">⚡ Jugar en Warp</button>
            `;

            if (isAdmin) {
                htmlStr += `<button class="btn-danger" onclick="deleteProject('${key}')">🗑️ Eliminar Definitivamente</button>`;
            }
            
            card.innerHTML = htmlStr;
            gallery.appendChild(card);
        }

        async function deleteProject(key) {
            if (!confirm("¿Seguro que quieres borrar este proyecto?")) return;
            
            try {
                const res = await fetch(SERVER_URL + 'delete.php', {
                    method: 'DELETE', 
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ apiKey: API_KEY, key: key })
                });

                const result = await res.json();
                if(res.ok && result.success !== false) {
                    // Borrar también los comentarios asociados
                    const cmtKey = key.replace(PREFIX, CMT_PREFIX);
                    fetch(SERVER_URL + 'delete.php', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ apiKey: API_KEY, key: cmtKey })
                    }).catch(e => console.warn("No se pudieron borrar los comentarios:", e));
                    
                    loadProjects();
                } else {
                    throw new Error('El servidor rechazó borrarlo');
                }
            } catch(e) {
                alert("Error borrando el proyecto: " + e.message);
            }
        }

        // MODIFICADO: Recibe la key y carga los comentarios
        function playProject(projectUrl, key) {
            if (!projectUrl) {
                alert("Este proyecto no tiene una URL válida.");
                return;
            }
            currentProjectKey = key; // Guardamos en qué proyecto estamos
            const warpUrl = 'https://warp.mistium.com/?project_url=' + encodeURIComponent(projectUrl);
            
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('game-view').style.display = 'flex';
            document.getElementById('game-iframe').src = warpUrl;
            
            // Cargar la sección de comentarios para este proyecto
            loadComments(currentProjectKey);
        }

        function closeGame() {
            document.getElementById('game-iframe').src = '';
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            currentProjectKey = '';
        }

        // --- NUEVAS FUNCIONES PARA LOS COMENTARIOS --- //

        async function loadComments(projectKey) {
            const listDiv = document.getElementById('comments-list');
            listDiv.innerHTML = '<p style="color: var(--text-muted);">Cargando comentarios...</p>';
            
            const cmtKey = projectKey.replace(PREFIX, CMT_PREFIX);

            try {
                const resGet = await fetch(SERVER_URL + 'get.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ apiKey: API_KEY, key: cmtKey })
                });
                
                const getData = await resGet.json();
                
                if (getData.success && getData.data && getData.data.value) {
                    const comments = JSON.parse(getData.data.value);
                    if (comments.length === 0) {
                        listDiv.innerHTML = '<p style="color: var(--text-muted);">Sé el primero en comentar.</p>';
                        return;
                    }
                    
                    listDiv.innerHTML = '';
                    // Mostrar los comentarios
                    comments.forEach(cmt => {
                        const dateObj = new Date(cmt.date);
                        const dateStr = `${dateObj.toLocaleDateString()} ${dateObj.toLocaleTimeString()}`;
                        
                        const cmtHtml = `
                            <div class="comment-item">
                                <img src="${escapeHTML(cmt.pfpUrl)}" alt="PFP" class="comment-pfp" loading="lazy">
                                <div class="comment-content">
                                    <div class="comment-header">
                                        <span class="comment-name">${escapeHTML(cmt.name)}</span>
                                        <span class="comment-date">${dateStr}</span>
                                    </div>
                                    <div class="comment-text">${escapeHTML(cmt.text)}</div>
                                </div>
                            </div>
                        `;
                        listDiv.innerHTML += cmtHtml;
                    });
                } else {
                    listDiv.innerHTML = '<p style="color: var(--text-muted);">Sé el primero en comentar.</p>';
                }
            } catch (err) {
                listDiv.innerHTML = '<p style="color: #ff4444;">Error al cargar comentarios.</p>';
                console.warn("Error cargando comentarios:", err);
            }
        }

        async function postComment() {
            if (!currentProjectKey) return;
            
            const nameInput = document.getElementById('cmt-name').value.trim();
            const textInput = document.getElementById('cmt-text').value.trim();
            const pfpInput = document.getElementById('cmt-pfp');
            const btn = document.getElementById('cmt-btn');
            const status = document.getElementById('cmt-status');

            if (!textInput) {
                status.style.color = '#ff4444';
                status.textContent = "¡Escribe un comentario primero!";
                return;
            }

            btn.disabled = true;
            status.style.color = 'var(--text)';

            try {
                // 1. Subir Foto de perfil si hay
                let pfpUrl = 'https://via.placeholder.com/50/1a1a24/00ff6b?text=👤'; // Default PFP
                if (pfpInput.files.length > 0) {
                    status.textContent = "Subiendo imagen de perfil...";
                    pfpUrl = await uploadFileToYYF(pfpInput.files[0]);
                }

                // 2. Obtener comentarios actuales
                status.textContent = "Publicando...";
                const cmtKey = currentProjectKey.replace(PREFIX, CMT_PREFIX);
                let comments = [];
                
                try {
                    const resGet = await fetch(SERVER_URL + 'get.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ apiKey: API_KEY, key: cmtKey })
                    });
                    const getData = await resGet.json();
                    if (getData.success && getData.data && getData.data.value) {
                        comments = JSON.parse(getData.data.value);
                    }
                } catch(e) {
                    // Si falla, asumimos que no hay comentarios y seguimos con el array vacío
                }

                // 3. Agregar el nuevo
                comments.push({
                    name: nameInput || 'Anónimo',
                    text: textInput,
                    pfpUrl: pfpUrl,
                    date: Date.now()
                });

                // 4. Guardar en el server
                const dbResponse = await fetch(SERVER_URL + 'store.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({
                        apiKey: API_KEY,
                        key: cmtKey,
                        value: JSON.stringify(comments),
                        mimeType: 'application/json'
                    })
                });

                if (dbResponse.ok) {
                    status.textContent = "";
                    document.getElementById('cmt-text').value = '';
                    document.getElementById('cmt-pfp').value = ''; // Limpiar archivo
                    loadComments(currentProjectKey); // Recargar la lista
                } else {
                    throw new Error("El servidor rechazó el comentario.");
                }

            } catch (error) {
                status.style.color = '#ff4444';
                status.textContent = "Error: " + error.message;
            } finally {
                btn.disabled = false;
            }
        }

        function escapeHTML(str) {
            if (typeof str !== 'string') return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }
    </script>
</body>
</html>
